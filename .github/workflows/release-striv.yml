name: Build & Release striv.exe

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Use standard MSVC linker on GitHub Runner
        shell: pwsh
        run: |
          if (Test-Path .cargo/config.toml) {
            Remove-Item -Force .cargo/config.toml
          }

      - name: Run Workspace Tests
        run: cargo test --workspace --release

      - name: Build striv.exe (Release)
        run: cargo build --release -p striv-cli

      - name: Stage striv.exe
        shell: pwsh
        run: Copy-Item target/release/striv-cli.exe striv.exe -Force

      - name: Upload striv.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: striv-windows-x86_64
          path: striv.exe

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: striv.exe
          generate_release_notes: true
