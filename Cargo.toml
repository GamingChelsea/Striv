[workspace]
resolver = "2"
members = [
    "crates/striv-syntax",
    "crates/striv-jit",
    "crates/striv-cli",
    "crates/lang-lsp", "crates/lang-runtime", "crates/lang-bindgen",
]

[workspace.dependencies]
logos = "0.16.1"
cranelift = "0.138"
cranelift-jit = "0.138"
cranelift-module = "0.138"
cranelift-native = "0.138"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tiny_http = "0.12"
minifb = "0.27"
slotmap = "1.0"
syn = { version = "2", features = ["full", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"
